# DatasetRecipe：fixture.alpha（4 条 REPLY：2 个 family 对照成对 + 2 个 standalone）
package_id: recipe.fixture.alpha
package_type: recipe
schema_version: aip.recipe.v4
package_version: 1.0.0
compatible_core_range: "*"
dependencies: []
status: approved
recipe_id: recipe:fixture:alpha
strata:
  - task_type: casual
    mode_id: REPLY
    target_count: 4
    min_family_count: 2
    evidence_state_distribution: {not_required: 1.0}
    policy_distribution: {answer: 1.0}
    # 大块 B（阶段 2）：fixture 单候选（K 候选由专用测试覆盖）
    candidate_count: 1
    risk_level: low
    review_requirement: auto
contrast_suites: []
memory_selection_policy: {}
refusal_bounds: {}
training_mix: {}
