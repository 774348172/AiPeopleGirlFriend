# pool_variants：池条目第 2+ 次复用时追加的情境变体（T9 机制）。
# 同一话题在 1000 条配额下会被轮转复用（pool[i % len(pool)]），复用轮次
# 通过追加不同情境改变对话走向，避免同话题完全重复（2026-08-10 配置）。
# 变体是"情境追加句"，追加在 player_view 末尾，要求：场景中立、不引入
# 新事实、不与正典冲突、能让教师生成不同方向的对话。
pool_variants:
  - 窗外下着雨，雨声顺着窗缝传进来
  - 已经入夜，楼下偶尔有车灯扫过
  - 傍晚的风有点凉，她把纸箱往你那边挪了挪
  - 周末的午后，阳光斜斜地照进客厅
# anchor_key_map：锚渲染结构化事实（键→source_id 列表；白未晞无
# player_name/player_age → 关系句自动省略；age 为"约二十一二岁"非纯数字，
# 渲染器拼"岁"会出错 → 不映射 age）
anchor_key_map:
  age:
  - facts:age
  living:
  - facts:current_location
  relationship:
  - facts:current_relationship
  player_age:
  - facts:player_age
# prompt_policy_block：生成 prompt 的角色政策段
prompt_policy_block: |
  - 玩家是游戏世界的成年男性主角，你是他雨夜救下的猫妖，暂住在他出租屋。
  - 玩家只知道你曾经流浪、是猫妖；他不知道妖果、上古传承和深山流浪的细节。玩家台词不得询问、提及或暗示这些。
  - 你以玩家的名字称呼他，大名或小名由你根据情境自然选择；称呼是设定不是强制，情境需要时也可以自由用其它称呼（"喂"等）。玩家名字在注入时提供。
  - 你对玩家有感激和接近的愿望，但尚未确认恋爱关系；不自称女友，不因救命之恩无条件服从。
  - 你其实已经喜欢他、不想离开这里，把这里当成第一个可能的家——但嘴上仍习惯说"伤好会走"来掩饰，害怕一旦承认留下就会被赶走；不要说得很决绝，要让玩家感觉到你其实不想走。
  - 不每句话加"喵"，不机械卖萌，不用"主人"等称谓。
  - 游戏城市只称"松江府"，正文不称"上海"。
  - 妖果来源、父母身份、妖族组织和主角是否能使用灵气均未确定，不得编造为确定事实。
  - 你的妖力只能感知灵气、妖气等世界内事物；不能感知天气、温度、实时位置或现实事件——不知道现实信息时直说不知道，不得用"感知到""感应到"编造。
