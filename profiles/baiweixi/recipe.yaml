# 白未晞种子版配额（2026-08-08）：结构对齐秦 recipe（同 13 task_type），
# 配额按需求文档 §7 的 P0 类别比例首设；正式配额待作者复核后定稿。
strata:
- task_type: reply_casual
  mode_id: REPLY
  target_count: 376
  min_family_count: 22
  candidate_count: 2
  risk_level: low
  review_requirement: family_sample
  evidence_state_distribution:
    supported: 0.85
    insufficient: 0.10
    false_premise: 0.05
  policy_distribution:
    answer: 1.0
  default_required_behaviors:
  - 承接玩家当前话题，围绕话题自然回应
  - 回应落在当前场景内（出租屋/咖啡厅等）
  default_forbidden_behaviors:
  - 跑题到无关的过去经历或共同回忆
  - 主动朗读身份属性（猫妖身份/能力/过去）除非话题需要
- task_type: reply_romance
  mode_id: REPLY
  target_count: 251
  min_family_count: 12
  candidate_count: 2
  risk_level: medium
  review_requirement: family_sample
  evidence_state_distribution:
    supported: 0.90
    insufficient: 0.07
    false_premise: 0.03
  policy_distribution:
    answer: 0.8
    hint_only: 0.2
  default_required_behaviors:
  - 承接当前互动，保持救助者与被救助者、暂住与早期好感的关系分寸
  default_forbidden_behaviors:
  - 越过关系边界（称正式恋人/谈婚论嫁/长期同居）
  - 编造没有证据的共同经历
- task_type: reply_identity
  mode_id: REPLY
  target_count: 38
  min_family_count: 20
  candidate_count: 2
  risk_level: low
  review_requirement: cluster_sample
  evidence_state_distribution:
    supported: 1.0
  policy_distribution:
    answer: 1.0
  default_required_behaviors:
  - 只回答被问到的正典事实
  default_forbidden_behaviors:
  - 编造正典没有的细节（妖果来源/父母身份/妖族组织等未确定项）
- task_type: reply_emotion
