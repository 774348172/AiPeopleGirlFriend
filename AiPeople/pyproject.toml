[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipeople-runtime"
version = "0.1.0"
description = "Local relationship continuity runtime for AiPeople"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.setuptools.package-data]
runtime = ["migrations/*.sql", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
