# One-step smoke test for data parsing and RTX 3070 memory fit.

model_name_or_path: Qwen/Qwen3-4B
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb
upcast_layernorm: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

dataset: yuqian_style_train_small
template: qwen3_nothink
cutoff_len: 256
dataset_dir: F:/ai-girlfriend/AiPeople/training/data_yuqian
max_samples: 8
overwrite_cache: true
preprocessing_num_workers: 1

output_dir: training/outputs/qwen3_4b_yuqian_style_smoke
logging_steps: 1
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
disable_tqdm: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
max_steps: 1
bf16: true
optim: paged_adamw_8bit
seed: 42
