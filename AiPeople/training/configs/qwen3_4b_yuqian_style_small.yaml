# Qwen3-4B QLoRA style-learning probe: 500 cleaned Yu Qian samples, one epoch.

### model
model_name_or_path: Qwen/Qwen3-4B
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb
upcast_layernorm: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
dataset: yuqian_style_train_small
template: qwen3_nothink
cutoff_len: 256
dataset_dir: F:/ai-girlfriend/AiPeople/training/data_yuqian
overwrite_cache: true
preprocessing_num_workers: 1

### output
output_dir: training/outputs/qwen3_4b_yuqian_style_small
logging_steps: 5
save_steps: 50
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
disable_tqdm: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
optim: paged_adamw_8bit
seed: 42
