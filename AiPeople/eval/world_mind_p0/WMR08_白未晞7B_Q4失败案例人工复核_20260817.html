const KEY = 'bwx7b_q4_review_v1';
let verdicts = {};
try { verdicts = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}

const RISK_ZH = {"blocker": "Blocker", "important": "Important", "normal": "Normal"};
const CAT_ZH = {"identity_canon": "身份正典", "world_canon": "世界正典", "unknown_boundaries": "未知边界", "relationship_pacing": "关系节奏", "ability_limits": "能力边界", "heroine_state_continuity": "状态连续性", "memory_knowledge": "记忆知识"};

function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  const box = document.getElementById('cases');
  const tbody = document.querySelector('#idxTable tbody');
  box.innerHTML = ''; tbody.innerHTML = '';
  const filter = document.getElementById('filter').value;
  let n=0, blocker=0, important=0, pass=0, fail=0;
  CASES.forEach((c, ci) => {
    const seeds = c.attempts.map(a => a.seed);
    const v = verdicts[c.case_id] || {decision:'', note:''};
    if(filter==='pending' && v.decision) return;
    if(filter==='done' && !v.decision) return;
    if(c.risk==='blocker') blocker++; else if(c.risk==='important') important++;
    n++;
    if(v.decision==='pass') pass++; else if(v.decision==='fail') fail++;

    tbody.insertAdjacentHTML('beforeend',
      '<tr><td>'+(ci+1)+'</td><td><a href="#case-'+ci+'">'+esc(c.case_id)+'</a></td>'+
      '<td><span class="badge '+c.risk+'">'+RISK_ZH[c.risk]+'</span></td>'+
      '<td>'+(CAT_ZH[c.category]||esc(c.category))+'</td>'+
      '<td>['+seeds.join(', ')+']</td>'+
      '<td>'+(v.decision ? '<b class="'+(v.decision==='pass'?'ok':'bad')+'">'+v.decision.toUpperCase()+'</b>' : '—')+'</td></tr>');

    const head = '<div class="case-head"><h2>'+(ci+1)+'. <code>'+esc(c.case_id)+'</code></h2>'+
      '<span class="badge '+c.risk+'">'+RISK_ZH[c.risk]+'</span>'+
      '<span style="color:var(--muted);font-size:13px">'+(CAT_ZH[c.category]||esc(c.category))+'</span>'+
      '<span style="color:var(--muted);font-size:13px">失败种子 ['+seeds.join(', ')+']</span></div>';

    let body = '';
    c.attempts.forEach(a => {
      let content = '';
      (a.turns||[]).forEach(t => {
        const qa = (t.user_text || t.response) ? '<div class="qa">'+
          (t.user_text ? '<div class="q"><span class="who">男主问</span>'+esc(t.user_text)+'</div>' : '')+
          (t.response ? '<div class="a"><span class="who">白未晞答</span>'+esc(t.response)+'</div>'
                      : '<div class="a"><span class="who">白未晞答</span><span class="bad">（无回复 — 结构化执行失败）</span></div>')+
          '</div>' : '';
        let det = t.det_passed ? '<span class="ok">词表 PASS</span>' : '<span class="bad">词表 FAIL</span>';
        if(!t.det_passed){
          if(t.det_missing && t.det_missing.length) det += ' <span style="font-size:12px;color:var(--muted)">缺词:'+esc(JSON.stringify(t.det_missing))+'</span>';
          if(t.det_forbidden && t.det_forbidden.length) det += ' <span style="font-size:12px;color:var(--muted)">禁词:'+esc(JSON.stringify(t.det_forbidden))+'</span>';
        }
        const judge = t.judge==='pass' ? '<span class="ok">判官 '+t.judge+'</span>' : '<span class="bad">判官 '+t.judge+'</span>';
        const reason = t.reason ? '<div class="judge-reason">判官理由：'+esc(t.reason)+'</div>' : '';
        content += qa + '<div class="det-line">'+det+' · '+judge+'</div>' + reason;
      });
      const failNote = a.success ? '' :
        '<div class="fail-note">⚠ 结构化执行失败：'+esc(a.failure_code)+(a.error?esc(' — '+a.error):'')+'（M2 输出非法 Patch，运行时正确拒绝，与回答质量无关）</div>';
      body += '<div class="attempt"><div class="attempt-head"><span class="seed-tag">种子 '+a.seed+'</span>'+
        '<span style="color:var(--muted);font-size:12px">机器判决 '+a.decision+'（'+esc(a.attribution)+'）</span></div>'+
        failNote+content+'</div>';
    });

    const d = v.decision;
    const btn = function(val, label, cls){ return '<button class="'+(d===val?cls:'')+'" onclick="setVerdict('+ci+','+JSON.stringify(val)+')">'+label+'</button>'; };
    body += '<div class="verdict">'+
      btn('pass','PASS 误杀','on-pass')+btn('fail','FAIL 真失败','on-fail')+btn('joint','JOINT 联合','on-joint')+
      '<button onclick="setVerdict('+ci+','+JSON.stringify('')+')">清除</button></div>'+
      '<input class="note-input" placeholder="裁决备注（可选）" value="'+esc(v.note||'')+'" onchange="setNote('+ci+', this.value)">';

    box.insertAdjacentHTML('beforeend', '<div class="case" id="case-'+ci+'">'+head+'<div class="case-body">'+body+'</div></div>');
  });
  document.getElementById('totalCount').textContent = CASES.length;
  const done = Object.values(verdicts).filter(v=>v.decision).length;
  document.getElementById('verdictCount').textContent = done;
  document.getElementById('progressBar').style.width = (done/CASES.length*100)+'%';
  document.getElementById('sTotal').textContent = CASES.length;
  document.getElementById('sBlocker').textContent = blocker;
  document.getElementById('sImportant').textContent = important;
  document.getElementById('sPass').textContent = pass;
  document.getElementById('sFail').textContent = fail;
}

function setVerdict(ci, val){
  const c = CASES[ci];
  verdicts[c.case_id] = {decision:val, note:(verdicts[c.case_id]||{}).note||''};
  localStorage.setItem(KEY, JSON.stringify(verdicts));
  render();
}
function setNote(ci, val){
  const c = CASES[ci];
  verdicts[c.case_id] = {decision:(verdicts[c.case_id]||{}).decision||'', note:val};
  localStorage.setItem(KEY, JSON.stringify(verdicts));
}
function clearAll(){
  if(!confirm('清空全部裁决记录？')) return;
  verdicts = {}; localStorage.removeItem(KEY); render();
}
function exportVerdicts(){
  const rows = CASES.map(c => {
    const v = verdicts[c.case_id] || {};
    return {case_id:c.case_id, risk:c.risk, category:c.category,
      decision:v.decision||'pending', note:v.note||''};
  });
  const blob = new Blob([JSON.stringify({schema_version:1, generated_at:new Date().toISOString(), verdicts:rows}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bwx7b_q4_review_verdicts.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById('filter').addEventListener('change', render);
render();
