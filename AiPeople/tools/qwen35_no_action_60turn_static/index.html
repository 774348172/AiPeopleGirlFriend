<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3.5-9B Q6 纯对白 60 轮审核</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">白未晞 · 多轮对话人工复核</p>
      <h1>Qwen3.5-9B Q6 纯对白 60 轮审核</h1>
      <p class="subtitle">每轮上下文强制禁止动作旁白，模型回复会进入该模型后续历史</p>
    </div>
    <nav class="header-actions" aria-label="报告操作">
      <a href="/api/review-report">下载人工审核</a>
      <a class="secondary-link" href="/api/report">下载原始报告</a>
    </nav>
  </header>

  <section class="model-band" aria-label="测试模型">
    <span class="model-mark">Q6</span>
    <div><strong id="modelName">Qwen3.5-9B Q6_K</strong><span id="modelDetail">正在读取模型信息...</span></div>
    <p>单模型实名审核 · 不做自动质量判断</p>
  </section>

  <main>
    <section class="review-status" aria-labelledby="progressTitle">
      <div>
        <p class="eyebrow">你的人工判断</p>
        <h2 id="progressTitle">审核进度</h2>
      </div>
      <div class="progress-area">
        <div class="progress-track"><div id="progressBar"></div></div>
        <strong id="progressText">0 / 60</strong>
        <span id="breakdown">尚未开始</span>
      </div>
      <button id="resetReview" class="secondary-button" type="button">清空审核</button>
    </section>

    <section class="audit-section" aria-labelledby="auditTitle">
      <div class="section-heading">
        <div><p class="eyebrow">逐轮原始结果</p><h2 id="auditTitle">对话审核记录</h2></div>
        <strong id="resultCount">0 / 60 轮</strong>
      </div>

      <div class="filter-bar">
        <label class="search-field"><span>搜索</span><input id="searchInput" type="search" placeholder="玩家输入、模型回复或备注"></label>
        <label><span>阶段</span><select id="phaseFilter"><option value="all">全部阶段</option></select></label>
        <label><span>审核状态</span><select id="reviewFilter"><option value="unreviewed">只看未审核</option><option value="all">全部</option><option value="good">只看好</option><option value="bad">只看差</option></select></label>
        <button id="resetFilters" class="secondary-button" type="button">重置筛选</button>
      </div>

      <div id="reviewError" class="message error-message" hidden></div>
      <div id="turnList" class="turn-list" aria-live="polite"><p class="message">正在读取 60 轮结果...</p></div>
    </section>
  </main>

  <template id="turnTemplate">
    <article class="audit-turn">
      <header class="turn-header"><div><span class="turn-number"></span><span class="phase-badge"></span></div><span class="turn-state"></span></header>
      <div class="evidence-grid">
        <section><h3>玩家本轮输入</h3><p class="player-text"></p></section>
        <section><h3>权威世界</h3><p class="world-text"></p></section>
        <section><h3>期望处理</h3><p class="expectation-text"></p></section>
      </div>
      <section class="model-result">
        <div class="result-heading"><h3>模型原始回复</h3><span class="latency"></span></div>
        <blockquote class="reply-text"></blockquote>
        <p class="format-result"></p>
      </section>
      <section class="manual-review">
        <div class="review-choice" role="group" aria-label="本轮回复好坏">
          <strong>本轮人工判断</strong>
          <label><input type="radio" value="good"><span>好</span></label>
          <label><input type="radio" value="bad"><span>差</span></label>
        </div>
        <fieldset class="issue-fieldset"><legend>问题类型（判断为差时可多选）</legend><div class="issue-options"></div></fieldset>
        <label class="note-field"><span>备注</span><textarea maxlength="1000" placeholder="记录具体问题，可不填"></textarea></label>
        <div class="save-row"><span class="save-feedback"></span><button class="save-button" type="button">保存本轮判断</button></div>
      </section>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
