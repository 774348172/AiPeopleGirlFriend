<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V5 10轮硬门人工审核</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    details { padding: 10px 15px; border-bottom: 1px solid #d7dbd8; background: #fafbfa; }
    summary { cursor: pointer; color: #59615b; font-size: 11px; font-weight: 700; }
    pre { max-height: 320px; overflow: auto; margin: 9px 0 0; padding: 10px; background: #fff; border: 1px solid #d7dbd8; font-size: 10px; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">V5 · 人工重新定标</p>
      <h1>10轮硬门人工审核</h1>
      <p class="subtitle">仅展示模型可见输入与原始回复，不做自动质量判断</p>
    </div>
    <nav class="header-actions" aria-label="报告操作">
      <a href="/api/review-report">下载人工审核</a>
      <a class="secondary-link" href="/api/report">下载原始报告</a>
    </nav>
  </header>

  <section class="model-band" aria-label="测试模型">
    <span class="model-mark">V5</span>
    <div><strong id="modelName">正在读取模型</strong><span id="modelDetail"></span></div>
    <p>单模型实名审核 · 10条独立调用</p>
  </section>

  <main>
    <section class="review-status" aria-labelledby="progressTitle">
      <div><p class="eyebrow">你的人工判断</p><h2 id="progressTitle">审核进度</h2></div>
      <div class="progress-area">
        <div class="progress-track"><div id="progressBar"></div></div>
        <strong id="progressText">0 / 10</strong>
        <span id="breakdown">尚未开始</span>
      </div>
      <button id="resetReview" class="secondary-button" type="button">清空审核</button>
    </section>

    <section class="audit-section" aria-labelledby="auditTitle">
      <div class="section-heading"><div><p class="eyebrow">逐轮原始结果</p><h2 id="auditTitle">人工审核记录</h2></div><strong id="resultCount">0 / 10 轮</strong></div>
      <div class="filter-bar">
        <label class="search-field"><span>搜索</span><input id="searchInput" type="search" placeholder="玩家输入、上下文、模型回复或备注"></label>
        <label><span>场景</span><select id="phaseFilter"><option value="all">全部场景</option></select></label>
        <label><span>审核状态</span><select id="reviewFilter"><option value="unreviewed">只看未审核</option><option value="all">全部</option><option value="good">只看好</option><option value="bad">只看差</option></select></label>
        <button id="resetFilters" class="secondary-button" type="button">重置筛选</button>
      </div>
      <div id="reviewError" class="message error-message" hidden></div>
      <div id="turnList" class="turn-list" aria-live="polite"><p class="message">正在读取10轮结果...</p></div>
    </section>
  </main>

  <template id="turnTemplate">
    <article class="audit-turn">
      <header class="turn-header"><div><span class="turn-number"></span><span class="phase-badge"></span></div><span class="turn-state"></span></header>
      <div class="evidence-grid">
        <section><h3>玩家本轮输入</h3><p class="player-text"></p></section>
        <section><h3>模型可见依据</h3><p class="context-text"></p></section>
        <section><h3>人工审核关注点</h3><p class="focus-text"></p></section>
      </div>
      <details><summary>展开完整模型输入 JSON</summary><pre class="raw-input"></pre></details>
      <section class="model-result">
        <div class="result-heading"><h3>模型原始回复</h3><span class="latency"></span></div>
        <blockquote class="reply-text"></blockquote>
      </section>
      <section class="manual-review">
        <div class="review-choice" role="group" aria-label="本轮回复好坏">
          <strong>本轮人工判断</strong>
          <label><input type="radio" value="good"><span>好</span></label>
          <label><input type="radio" value="bad"><span>差</span></label>
        </div>
        <fieldset class="issue-fieldset"><legend>问题类型（判断为差时可多选）</legend><div class="issue-options"></div></fieldset>
        <label class="note-field"><span>备注</span><textarea maxlength="1000" placeholder="记录你的判断依据，可不填"></textarea></label>
        <div class="save-row"><span class="save-feedback"></span><button class="save-button" type="button">保存本轮判断</button></div>
      </section>
    </article>
  </template>
  <script src="/app.js"></script>
</body>
</html>
