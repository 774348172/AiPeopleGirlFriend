<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白未晞 · 新训练三方审核</title>
<style>*{box-sizing:border-box}body{font:15px/1.65 system-ui;margin:0;background:#f5f7f8;color:#252d32;letter-spacing:0}header,main{max-width:1250px;margin:auto;padding:20px}h1{font-size:24px}h2{font-size:18px}h3{font-size:16px;margin:0}article{border-top:1px solid #cbd2d7;padding:22px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.reply{border:1px solid #cbd2d7;border-radius:4px;padding:16px;background:white}.reply p{white-space:pre-wrap;overflow-wrap:anywhere;min-height:65px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 system-ui}small{color:#59616a}button,select{padding:8px;font:inherit}label{display:block;margin-top:10px}#status{color:#79551f}@media(max-width:760px){.grid{grid-template-columns:1fr}.reply p{min-height:0}}</style>
<header><h1>白未晞 · 新训练三方审核</h1><span id="count"></span> <button id="export">下载人工审核结果</button><p id="status" role="status"></p></header><main id="cases"></main>
<script>
const original=__REPORT__;let report=structuredClone(original);const key='frontend-regression12:'+report.generated_at;const arms=Object.keys(report.arms);const status=document.getElementById('status');
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.source_sha256===original.source_sha256&&saved.cases.length===12){saved.cases.forEach((c,i)=>{if(c.sample_id!==original.cases[i].sample_id)throw Error('样本不匹配');arms.forEach(a=>{if(!['','好','差'].includes(c.human_review[a]))throw Error('评分无效');report.cases[i].human_review[a]=c.human_review[a]})})}}catch(e){status.textContent='恢复失败：'+e.message}
function progress(){document.getElementById('count').textContent='已审核 '+report.cases.reduce((n,c)=>n+arms.filter(a=>c.human_review[a]).length,0)+' / 36'}
function save(){try{localStorage.setItem(key,JSON.stringify(report));status.textContent='判断已保存在本机'}catch(e){status.textContent='本机保存失败，请下载结果：'+e.message}progress()}
for(const c of report.cases){const article=document.createElement('article');const h=document.createElement('h2');h.textContent='第 '+c.ordinal+' 题 · '+c.question;article.append(h);const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='本轮上下文';const pre=document.createElement('pre');pre.textContent=c.messages.map(m=>m.role+'\n'+m.content).join('\n\n');details.append(summary,pre);article.append(details);const grid=document.createElement('div');grid.className='grid';for(const arm of arms){const box=document.createElement('div');box.className='reply';const title=document.createElement('h3');title.textContent=report.arms[arm].label;const text=document.createElement('p');text.textContent=c.arms[arm].response;const time=document.createElement('small');time.textContent='总生成耗时 '+(c.arms[arm].elapsed_ms/1000).toFixed(2)+' 秒';const label=document.createElement('label');label.textContent='人工判断 ';const select=document.createElement('select');select.setAttribute('aria-label','第'+c.ordinal+'题 '+report.arms[arm].label);for(const value of ['','好','差']){const option=document.createElement('option');option.value=value;option.textContent=value||'未判断';select.append(option)}select.value=c.human_review[arm];select.onchange=()=>{c.human_review[arm]=select.value;save()};label.append(select);box.append(title,text,time,label);grid.append(box)}article.append(grid);document.getElementById('cases').append(article)}progress();
document.getElementById('export').onclick=()=>{const n=report.cases.reduce((n,c)=>n+arms.filter(a=>c.human_review[a]).length,0);if(!n){status.textContent='尚无人工判断，未导出空文件';return}report.status=n===36?'human_review_complete':'partially_reviewed';report.reviewed_at=new Date().toISOString();save();const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='frontend_full_regression12_user_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
