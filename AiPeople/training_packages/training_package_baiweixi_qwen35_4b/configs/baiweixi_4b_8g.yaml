# LLaMA-Factory 训练配置 —— 白未晞人格（Qwen3.5-4B，RTX 3060/3070 8G QLoRA 版）
# 基座: Qwen/Qwen3.5-4B（本机缓存 ✅；VLM 架构，视觉塔自动冻结，纯文本训练）
# 数据: baiweixi_ready.jsonl（2882 条，2026-08-15 v4 最终批次：T19 记忆类型轴 + G7 放行 + 扩池重跑）
# 参考: training_package_baiweixi_local3060_qwen3（Qwen3-4B 实测 100s/微步）
#
# 训练: llamafactory-cli train configs/baiweixi_4b_8g.yaml
# 验证: python scripts/chat_baiweixi.py outputs/baiweixi_4b
# 验收: python scripts/check_acceptance.py outputs/baiweixi_4b
#
# 显存估算（4bit QLoRA, batch 1, seq 2048）: base 4bit ~2.4G + 激活 ~2.5G + LoRA/优化器 ~0.5G ≈ 6G ✅ 8G 可跑
# 时长估算（Qwen3.5-4B 与 Qwen3-4B 同量级 ~100s/微步）: 2882 条 × 1 epoch ≈ 720 微步/等效 batch 4 ≈ 20 小时；
#           建议先 1 epoch 验证人格（约 20 小时），满意后 RESUME 续训 2-3 epoch

### ----- model -----
model_name_or_path: D:/AIPeopleGit/ai-girlfriend/AiPeople/training_packages/models/Qwen3.5-4B
trust_remote_code: true
adapter_name_or_path:
quantization_bit: 4                          # QLoRA：8G 显存必须 4bit 量化
quantization_method: bitsandbytes

### ----- method -----
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16                                # 与 M3/H200 包一致
lora_alpha: 32
lora_dropout: 0.05

### ----- dataset -----
dataset: baiweixi_ready
template: qwen3_nothink                      # Qwen3/Qwen3.5 关闭思考模板（视觉塔自动冻结）
cutoff_len: 2048                             # 样本最长 ~1150 字符，2048 全覆盖
dataset_dir: data
overwrite_cache: true
preprocessing_num_workers: 1                # ⚠ Windows 多进程 map 会丢结果

### ----- output -----
output_dir: outputs/baiweixi_4b
logging_steps: 20
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true

### ----- train -----
per_device_train_batch_size: 1               # 8G 显存：batch 1
gradient_accumulation_steps: 4               # 等效 batch 4
learning_rate: 1.0e-4
num_train_epochs: 1.0                        # 先 1 epoch 验证人格；满意后 RESUME 续训
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
optim: adamw_bnb_8bit                        # ⚠ Windows 用 8bit 优化器（paged 版慢到 ~46s/微步）
