# LLaMA-Factory 训练配置 —— 白未晞人格（Qwen2.5-7B，本机 8G 显存 QLoRA 版）
# 硬件: RTX 3060 8G / 3070 8G（Ampere，sm_86，支持 bf16 + bitsandbytes 4bit）
# 数据: baiweixi_ready.jsonl（1190 条人工复核通过的 REPLY 数据，已剔除 rerank）
#
# 训练: llamafactory-cli train configs/baiweixi_7b_8g.yaml
# 验证: python scripts/chat_baiweixi.py outputs/baiweixi_7b
# 验收: python scripts/check_acceptance.py
#
# 显存估算（4bit QLoRA, batch 1, seq 1280）: base 4bit ~4.3G + 激活 ~2.5G + LoRA/优化器 ~0.6G ≈ 7.5G ⚠ 8G 贴边
# ⚠ Qwen2.5-7B 是 7B 模型：8G 显存比 4B 更紧张。若 OOM：
#   1) cutoff_len 降到 1024
#   2) gradient_accumulation_steps 降到 2
#   3) 或换 4090 版配置（bf16 全精度，显存充足）
# 时长估算: 1190 条 × 1 epoch ≈ 298 微步/等效 batch 4 ≈ 15-20 小时（7B 约为 4B 的 1.8-2 倍）

### ----- model -----
model_name_or_path: Qwen/Qwen2.5-7B  # 2026-08-13 白未晞基座（纯文本）
trust_remote_code: true
adapter_name_or_path:
quantization_bit: 4                          # QLoRA：8G 显存必须 4bit 量化
quantization_method: bitsandbytes

### ----- method -----
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32                                # 容量补足量化损失（alpha = 2×rank）
lora_alpha: 64
lora_dropout: 0.05

### ----- dataset -----
dataset: baiweixi_ready
template: qwen                             # Qwen2.5 系列 ChatML 模板（im_start 体系）
cutoff_len: 1280                             # 样本实际 ~700-900 token，1280 足够；省激活显存加速
dataset_dir: data
overwrite_cache: true
preprocessing_num_workers: 1                # ⚠ Windows 上 datasets 多进程 map 会丢结果；1190 条单进程即可

### ----- output -----
output_dir: outputs/baiweixi_7b
logging_steps: 20
save_steps: 100
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true

### ----- train -----
per_device_train_batch_size: 1               # 8G 显存：batch 1
gradient_accumulation_steps: 4               # 等效 batch 4
learning_rate: 1.0e-4                        # QLoRA 常用 2e-4；人格微调 5e-5~1e-4 更稳
num_train_epochs: 3.0                        # 3 epoch 补偿 4bit 训练的信息损失（约 45-60 小时挂机）
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true                                   # 3060/3070 支持 bf16
gradient_checkpointing: true                 # 省显存（7B 必须开）
optim: adamw_bnb_8bit                        # 8bit 优化器（paged 版在 Windows 上慢，勿用）
