# LLaMA-Factory 训练配置 —— 白未晞人格（RTX 4090 24GB bf16 全精度版）
# 硬件: RTX 4090 24GB（Ada，sm_89，支持 bf16 + flash-attn）
# 数据: baiweixi_ready.jsonl（1190 条人工复核通过的 REPLY 数据，已剔除 rerank）
#
# 训练: llamafactory-cli train configs/baiweixi_4b_4090.yaml
# 验证: python scripts/chat_baiweixi.py outputs/baiweixi_4b
# 验收: python scripts/check_acceptance.py
#
# 显存估算（bf16 全精度 LoRA, batch 4, seq 2048）: base bf16 ~8G + 激活 ~4G + LoRA/优化器 ~2G ≈ 14G ✅ 24G 可跑
# 时长估算（4090 实测推算 ~35-50s/微步，bf16 全精度）: 1190 条 × 1 epoch ≈ 75 微步/等效 batch 16 ≈ 1-1.5 小时；
#           2 epoch ≈ 2-3 小时；3 epoch ≈ 3-4.5 小时。

### ----- model -----
model_name_or_path: Qwen/Qwen3-4B  # 2026-08-11 白未晞基座（纯文本；24G 可跑 bf16 全精度）
trust_remote_code: true
adapter_name_or_path:
# 不设 quantization_bit —— 4090 24GB 显存够，bf16 全精度训练（质量比 4bit QLoRA 高一档）

### ----- method -----
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16                                # 与 M3/H200 包一致
lora_alpha: 32
lora_dropout: 0.05

### ----- dataset -----
dataset: baiweixi_ready
template: qwen3_nothink                      # Qwen3 关闭思考模板（LLaMA-Factory 内置）
cutoff_len: 2048                             # 4090 显存充足，覆盖全部样本（最长 ~1150 字符）
dataset_dir: data
overwrite_cache: true
preprocessing_num_workers: 1                # ⚠ Windows 上 datasets 多进程 map 会丢结果；1190 条单进程即可

### ----- output -----
output_dir: outputs/baiweixi_4b
logging_steps: 20
save_steps: 100
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true

### ----- train -----
per_device_train_batch_size: 4               # 24G 显存：batch 4
gradient_accumulation_steps: 4               # 等效 batch 16（大 batch 训练更稳）
learning_rate: 1.0e-4                        # 人格微调 5e-5~1e-4 更稳，过拟合时调低
num_train_epochs: 1.0                        # 先 1 epoch 验证人格（约 1-1.5 小时）；满意后 RESUME 续训
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true                                   # 4090 支持 bf16
gradient_checkpointing: false                # 24G 不贴边，无需 checkpointing（更快）
optim: adamw_torch                           # 24G 不需要 8bit 优化器
