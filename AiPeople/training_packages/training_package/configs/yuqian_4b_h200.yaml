# LLaMA-Factory 训练配置 —— 于谦人格（H200 全精度）
# H200: 141GB HBM3e, 不需要量化, 全精度 LoRA, bf16
#
# 用法: llamafactory-cli train configs/yuqian_4b_h200.yaml

### ----- model -----
model_name_or_path: Qwen/Qwen3-4B
trust_remote_code: true
adapter_name_or_path:
# 不设 quantization_bit —— H200 显存够，全精度训练

### ----- method -----
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16                              # H200 可用更大 rank
lora_alpha: 32
lora_dropout: 0.05

### ----- dataset -----
dataset: aipeople_persona
template: qwen3_nothink
cutoff_len: 2048                           # H200 显存够，用长上下文
dataset_dir: data
overwrite_cache: true
preprocessing_num_workers: 8

### ----- output -----
output_dir: outputs/yuqian_4b
logging_steps: 20
save_steps: 500
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true

### ----- train -----
per_device_train_batch_size: 8              # H200 可用大 batch
gradient_accumulation_steps: 2
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true                                  # H200 支持 bf16
optim: adamw_torch                          # H200 不需要 8-bit 优化器
