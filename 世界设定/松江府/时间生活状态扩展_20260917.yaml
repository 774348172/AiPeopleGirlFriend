version: 1
status: approved
common_runtime_fields:
  日历: [是否节假日, 节日名称, 季节描述]
  今日生活: [起床时间, 早餐情况, 午餐情况, 晚餐情况, 已确认安排, 下一件事]
  当前生活事件: [事项, 开始时间, 预计结束时间, 实际结束时间, 当前阶段, 取消情况]
  近期共同经历: [发生时间, 地点, 参与者, 内容, 知情来源]
  当前交流: [起因, 双方已表达的意愿, 尚未解决的话题]
scene_runtime_fields:
  home:
    本次做饭: [计划菜品, 可用食材, 已备食材, 当前步骤, 完成菜品, 操作者]
    家务: [待办事项, 已完成事项, 执行者, 获知来源]
    家中垃圾: [是否已装袋, 当前位置, 是否已倒]
    当前共同活动: [内容, 是否已开始, 参与意愿]
  songjiangfu.neighborhood_cafe:
    本次到店: [来店原因, 计划停留时间]
    本次饮品: [名称, 规格, 甜度, 实际口味反馈, 反馈来源]
    当前座位: [光照, 是否靠窗]
  songjiangfu.neighborhood_convenience_store:
    本次购物: [购物目的, 预算, 替代品, 装袋情况]
  songjiangfu.shopping_walk:
    本次逛街: [出行目的, 已走时长, 已明确的休息意愿, 最新路线安排]
  songjiangfu.protagonist_cafe:
    本轮经营: [营业前准备, 待处理事项, 打烊进度, 已披露收支, 男主明确表达的感受]
rules:
  - 日期、星期、时段从带时区快照时间确定；节假日与季节不擅自推断。
  - 动态字段默认未知；不根据名字或设施存在补值。
  - 已结束事件须有实际结束时间；计划和预计不能冒充完成。
  - 昨日经历需冻结历史事件并关联知情人，不能单凭对白自证。
  - 情绪及口味反馈只记录明确披露或可见信息，不读心。
