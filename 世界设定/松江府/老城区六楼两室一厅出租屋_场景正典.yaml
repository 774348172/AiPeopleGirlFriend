display_name: 松江府老城区六楼老破小出租屋

building:
  district: 松江府老城区
  building_type: 老旧居民楼
  floor: 6
  elevator: absent
  condition: 老破小
  environment:
    corridor_lighting: old_building_dim
    sound_insulation: poor
    water_supply_stability: occasionally_unstable
  notes:
    - 楼道和公共区域保持老旧居民楼特征。
    - 无电梯，上下楼通过楼梯。
    - 隔音差、楼道偏暗、上下水偶尔不稳是稳定环境倾向，不代表每一轮都发生对应事件。

layout:
  type: two_bedrooms_one_living_room
  spaces:
    entrance:
      id: apartment_entrance
      label: 狭窄玄关
      fixtures: [shoe_cabinet, key_hooks, umbrella_bucket]
    living_room:
      id: apartment_living_room
      label: 客厅
      role: shared_social_space
      fixtures: [sofa, small_table, basic_storage, television, fan, television_cabinet, dining_table, two_chairs, floor_lamp]
      connected_to: [entrance, kitchen, bathroom, master_bedroom, spare_bedroom, small_balcony]
    master_bedroom:
      id: apartment_master_bedroom
      label: 主卧
      occupant: protagonist
      assignment_status: fixed
      fixtures: [bed, wardrobe, desk, desk_outlet]
    spare_bedroom:
      id: apartment_spare_bedroom
      label: 次卧
      current_role: storage_and_spare_space
      occupant: none
      assignment_status: not_assigned_to_baiweixi
      fixtures: [bookshelf, storage_shelf, spare_bedding]
    kitchen:
      id: apartment_kitchen
      label: 厨房
      role: cooking_and_appliance_space
      fixtures: [sink, gas_stove, range_hood, refrigerator, basic_cabinets, cup_rack, rice_bin, spice_rack, cutting_board, two_bowls]
    bathroom:
      id: apartment_bathroom
      label: 卫生间
      role: bathing_and_washing_space
      fixtures: [toilet, washbasin, shower_area, towel_rack, mirror, mop_corner]
      water_heater: 60升储水式电热水器
    small_balcony:
      id: apartment_small_balcony
      label: 小阳台
      role: ventilation_and_clothes_drying
      connected_to: [living_room]
      fixtures: [drying_rod, laundry_basket]

