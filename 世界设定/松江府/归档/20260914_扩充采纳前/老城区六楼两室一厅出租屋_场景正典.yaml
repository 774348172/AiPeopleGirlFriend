world_id: songjiangfu
status: approved
version: 2
last_updated: '2026-09-12'
display_name: 松江府老城区六楼老破小出租屋

building:
  district: 松江府老城区
  building_type: 老旧居民楼
  floor: 6
  elevator: absent
  condition: 老破小
  environment:
    corridor_lighting: old_building_dim
    sound_insulation: poor
    water_supply_stability: occasionally_unstable
  notes:
    - 楼道和公共区域保持老旧居民楼特征。
    - 无电梯，上下楼通过楼梯。
    - 隔音差、楼道偏暗、上下水偶尔不稳是稳定环境倾向，不代表每一轮都发生对应事件。

layout:
  type: two_bedrooms_one_living_room
  spaces:
    entrance:
      id: apartment_entrance
      label: 狭窄玄关
    living_room:
      id: apartment_living_room
      label: 客厅
      role: shared_social_space
      fixtures: [sofa, small_table, basic_storage, television, fan]
      connected_to: [entrance, kitchen, bathroom, master_bedroom, spare_bedroom, small_balcony]
    master_bedroom:
      id: apartment_master_bedroom
      label: 主卧
      occupant: protagonist
      assignment_status: fixed
    spare_bedroom:
      id: apartment_spare_bedroom
      label: 次卧
      current_role: storage_and_spare_space
      occupant: none
      assignment_status: not_assigned_to_baiweixi
    kitchen:
      id: apartment_kitchen
      label: 厨房
      role: cooking_and_appliance_space
      fixtures: [sink, gas_stove, range_hood, refrigerator, basic_cabinets]
    bathroom:
      id: apartment_bathroom
      label: 卫生间
      role: bathing_and_washing_space
      fixtures: [toilet, washbasin, shower_area]
      water_heater: 60升储水式电热水器
    small_balcony:
      id: apartment_small_balcony
      label: 小阳台
      role: ventilation_and_clothes_drying
      connected_to: [living_room]

equipment:
  - id: electric_storage_water_heater
    label: 储水式电热水器
    location: bathroom
    existence: permanent
    capacity: 60升
  - id: washing_machine
    label: 洗衣机
    location: bathroom_or_small_balcony_area
    existence: permanent
  - id: refrigerator
    label: 冰箱
    location: kitchen
    existence: permanent
  - id: gas_stove
    label: 燃气灶
    location: kitchen
    existence: permanent
  - id: range_hood
    label: 抽油烟机
    location: kitchen
    existence: permanent
  - id: rice_cooker
    label: 电饭煲
    location: kitchen
    existence: permanent
  - id: microwave_oven
    label: 微波炉
    location: kitchen
    existence: permanent
  - id: electric_kettle
    label: 电热水壶
    location: kitchen
    existence: permanent
  - id: fan
    label: 风扇
    location: living_room
    existence: permanent
  - id: television
    label: 电视
    location: living_room
    existence: permanent

fixed_objects:
  baiweixi_cardboard_box:
    label: 白未晞的纸箱
    default_location: apartment_living_room.window_side_corner
    purpose: safety_place
    can_move_at_runtime: true
    rule: 默认位于客厅靠窗边角、能看到出口的位置；移动后必须由世界事件或快照记录。

occupancy:
  protagonist: apartment_master_bedroom
  baiweixi:
    current_status: temporary_cohabitant
    private_bedroom: none
    safety_place: baiweixi_cardboard_box
    rule: 白未晞暂住但未获得固定独立房间；次卧也不自动视为她的房间。

protagonist_profile:
  status: stable_baseline_preference
  identity:
    hometown: 四川
    note: 男主是四川人；居住在松江府不改变籍贯设定。
  food:
    regional_taste: 四川口味
    spicy_tolerance: 能吃辣
    richness: 喜欢油腻
  drinks: 平时喝温水，饮料偏低糖
  environment: 喜欢安静、通风和柔和灯光
  organization: 喜欢常用物品有固定位置，但不要求一尘不染
  leisure: 喜欢在家看书、听舒缓音乐，偶尔散步
  companionship: 喜欢自然聊天和安静陪伴，不希望每句话都变成建议或任务
  low_mood: 通常希望先被听见，再讨论怎么办
  reminders: 接受温和提醒，不喜欢被反复催促
  privacy: 不喜欢未经询问翻看手机和私人物品
  physical_contact: 不设为默认同意，按关系阶段和当下表达处理
  food_allergy: unknown
  disclosure_rule: 基础设定不等于白未晞已经知道；只有已登记记忆或男主明确告知后才能作为对话事实使用。

authority_rules:
  permanent_scene_facts:
    - building.floor
    - building.elevator
    - building.condition
    - layout
    - equipment.*.existence
    - fixed_objects.baiweixi_cardboard_box.default_location
  runtime_only_facts:
    - equipment.*.power_state
    - equipment.*.operating_mode
    - equipment.*.remaining_time
    - equipment.*.finish_eta
    - doors_and_windows
    - item_current_location
    - current_light_state
    - current_water_state
    - completed_household_action
  unknown_by_default:
    - 是否正在洗衣
    - 洗衣机当前程序和剩余时间
    - 电饭煲当前模式和剩余时间
    - 微波炉是否正在运行
    - 燃气灶是否点火
    - 热水器是否开启及热水剩余量
    - 当前门窗是否打开
    - 任何没有快照或事件来源的家务结果
  source_priority:
    authoritative:
      - runtime_snapshot
      - structured_game_event
      - world_canon
      - selected_memory
    non_authoritative_until_confirmed:
      - current_player_report_pending_confirmation
  unsupported_expansion_policy: reject
