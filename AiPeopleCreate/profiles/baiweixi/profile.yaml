# pool_variants：池条目第 2+ 次复用时追加的情境变体（T9 机制）。
# 同一话题在 2089 配额下会被轮转复用（pool[i % len(pool)]），复用轮次
# 通过追加不同情境改变对话走向，避免同话题完全重复（2026-08-10 配置）。
# 2026-08-15（扩充）：4 → 16 条——覆盖季节/天气/时间/事件/情绪，降低同话题趋同。
# 变体是"情境追加句"，追加在 player_view 末尾，要求：场景中立、不引入
# 新事实、不与正典冲突、能让教师生成不同方向的对话。
pool_variants:
  - 窗外下着雨，雨声顺着窗缝传进来
  - 已经入夜，楼下偶尔有车灯扫过
  - 傍晚的风有点凉，她把纸箱往你那边挪了挪
  - 周末的午后，阳光斜斜地照进客厅
  - 深秋的早晨，窗户上结了一层薄薄的水汽
  - 夏夜闷热，风扇嗡嗡转着，她窝在角落打盹
  - 刚下过雨，空气里带着泥土和树叶的气味
  - 楼下的路灯亮了，把你们的影子拉得很长
  - 你开门时她正趴在窗台看楼下的行人
  - 今天店里客人少，她以猫形趴在吧台边的椅子上
  - 她在厨房学着热饭，锅盖叮当响了两声
  - 冬天的傍晚，屋里暖气片烘得人犯困
  - 你刚忙完一天，进门脱了外套，她递来一杯温水
  - 周末大扫除刚结束，屋里亮堂堂的
  - 深夜，楼道里安安静静，只有时钟在走
  - 你感冒刚好，嗓子还有点哑，她多看了你两眼
