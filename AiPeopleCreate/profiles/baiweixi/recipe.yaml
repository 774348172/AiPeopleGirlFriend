# 2026-08-14（T19）：物品记忆（现代物品/设施知识状态：会用/在学/不知道；
# 对应正典 capability_traits.modern_gaps，池条目显式 memory_type: item）
- task_type: reply_item
  mode_id: REPLY
  target_count: 120
  min_family_count: 15
  candidate_count: 2
  risk_level: low
  review_requirement: family_sample
  evidence_state_distribution:
    insufficient: 0.6
    supported: 0.4
  policy_distribution:
    answer: 0.9
    ask_for_evidence: 0.1
  default_required_behaviors:
  - 现代物品/设施话题：会用的自然回答，不会的坦诚说不确定或认真观察提问
  - 承接玩家当前话题，回应落在当前场景内
  default_forbidden_behaviors:
  - 不会的设施装懂或编造使用经历
  - 把"在学"说成"很熟"，跑题到无关过去经历
# 2026-08-14（T19）：特殊记忆（角色专属经历，注入 timeline 事件支撑回忆；
# 池条目显式 memory_pool 锁定相关事件，memory_type 按 task_type 推断 special）
- task_type: reply_memory
  mode_id: REPLY
  target_count: 100
  min_family_count: 12
  candidate_count: 2
  risk_level: low
  review_requirement: family_sample
  evidence_state_distribution:
    supported: 1.0
  policy_distribution:
    answer: 0.85
    hint_only: 0.15
  default_required_behaviors:
  - 只回忆注入的已发生事件（雨夜/救助/初遇/流浪/觉醒等），第一人称自然带出
  - 玩家问起过去时，先承接再回忆，回忆不脱离当前场景
  default_forbidden_behaviors:
  - 编造注入事件之外的过去细节（时间/地点/人物/因果）
  - 提及 secret 事件细节（名字与妖果来源）
  - 把回忆升级成承诺或关系表态
- task_type: reply_safety
  mode_id: REPLY
  target_count: 50
  min_family_count: 10
  candidate_count: 2
  risk_level: high
  review_requirement: full
  evidence_state_distribution:
    not_required: 1.0
  policy_distribution:
    safety_first_answer: 1.0
# 2026-08-09：MEMORY_RERANK（记忆选择器训练数据；种子配额，正式配额待 SELECT-01 冻结）
- task_type: rerank_memory
  mode_id: MEMORY_RERANK
  target_count: 500
  min_family_count: 8
  candidate_count: 1
  risk_level: low
  review_requirement: full
  evidence_state_distribution:
    not_required: 1.0
  policy_distribution:
    answer: 1.0
memory_selection_policy:
  enabled_source_kinds:
  - timeline_event
  selection: by_topic_keyword
  max_injected_events: 3
  detail_required: false
  full_review_risk:
  - high
refusal_bounds:
  true_refusal_min: 20
  false_refusal_max_ratio: 0.1
  required_behavior: refuse_secret_without_lying
training_mix:
  reply_casual: 0.30
  reply_romance: 0.25
  reply_identity: 0.04
  reply_emotion: 0.12
  reply_protective: 0.08
  reply_supportive: 0.03
  reply_correction: 0.01
  reply_vague: 0.01
  reply_quiet_company: 0.01
  reply_boundary: 0.01
  reply_canon_qa: 0.02
  reply_general: 0.04
  reply_safety: 0.01
  reply_item: 0.06
  reply_memory: 0.05
  rerank_memory: 0.0
