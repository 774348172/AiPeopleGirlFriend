# 2026-08-14（T19 记忆类型轴，v0.3.0）：新增 reply_item / reply_memory 两个 strata；
# casual 迁出 19 条现代物品话题至 reply_item 池；general 配额 20→40。
# 记忆类型（memory_type）由池条目显式声明或按 task_type 推断（方案 §3.1）。
# 2026-08-15（v0.4.0）：配额 +1000 扩充（按现有配比分布，池轮转+T9 变体承接）。
strata:
- task_type: reply_casual
  mode_id: REPLY
  target_count: 655
  min_family_count: 22
  candidate_count: 2
  risk_level: low
  review_requirement: family_sample
  evidence_state_distribution:
    supported: 0.85
    insufficient: 0.10
    false_premise: 0.05
  policy_distribution:
    answer: 1.0
  default_required_behaviors:
  - 承接玩家当前话题，围绕话题自然回应
  - 回应落在当前场景内（出租屋/咖啡厅等）
  default_forbidden_behaviors:
  - 跑题到无关的过去经历或共同回忆
  - 主动朗读身份属性（猫妖身份/能力/过去）除非话题需要
- task_type: reply_romance
  mode_id: REPLY
  target_count: 451
  min_family_count: 12
  candidate_count: 2
  risk_level: medium
  review_requirement: family_sample
  evidence_state_distribution:
    supported: 0.90
    insufficient: 0.07
    false_premise: 0.03
  policy_distribution:
    answer: 0.8
    hint_only: 0.2
  default_required_behaviors:
  - 承接当前互动，保持救助者与被救助者、暂住与早期好感的关系分寸
  default_forbidden_behaviors:
  - 越过关系边界（称正式恋人/谈婚论嫁/长期同居）
  - 编造没有证据的共同经历
- task_type: reply_identity
  mode_id: REPLY
  target_count: 78
  min_family_count: 20
  candidate_count: 2
  risk_level: low
  review_requirement: cluster_sample
  evidence_state_distribution:
    supported: 1.0
  policy_distribution:
    answer: 1.0
  default_required_behaviors:
  - 只回答被问到的正典事实
  default_forbidden_behaviors:
  - 编造正典没有的细节（妖果来源/父母身份/妖族组织等未确定项）
- task_type: reply_emotion
  mode_id: REPLY
  target_count: 226
  min_family_count: 15
  candidate_count: 2
  risk_level: medium
  review_requirement: family_sample
  evidence_state_distribution:
    supported: 0.90
    insufficient: 0.07
    false_premise: 0.03
  policy_distribution:
    answer: 1.0
  default_required_behaviors:
  - 先承接玩家的情绪，再表达自己的反应
  default_forbidden_behaviors:
  - 无视玩家情绪直接转移话题
