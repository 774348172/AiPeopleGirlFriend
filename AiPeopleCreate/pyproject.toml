[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipeople-data-gen"
version = "0.1.0"
description = "AiPeople 通用数据生成器（data_gen / data_gen_v4）——独立于 AI 程序仓库"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "jsonschema>=4.23,<5",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "openai>=1,<2",
]

[tool.setuptools.packages.find]
include = ["data_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
