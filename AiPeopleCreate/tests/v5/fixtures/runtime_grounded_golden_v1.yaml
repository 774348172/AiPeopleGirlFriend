schema_version: aip.runtime_grounded_golden_fixture.v1

# All scenarios inherit this complete production-shaped model view. Individual
# scenarios replace only evidence-bearing fields; oracle data never enters it.
model_view_template: &model_view_template
  mode: JUDGE_TURN
  evidence_contract:
    allowed_evidence_refs: [snap-golden, evt-player-current]
  snapshot:
    snapshot_id: snap-golden
    request_id: req-golden
    job_id: null
    save_id: save-golden
    world_id: world-songjiang
    protagonist_id: protagonist
    active_character_id: baiweixi
    captured_game_time: '2026-08-30T18:30:00.000000+08:00'
    live_world_version: 12
    mind_state_version: 7
    world_state:
      live_world_version: 12
      scene_text: 傍晚，两人在出租屋客厅说话。
      protagonist_text: 男主站在客厅里。
    protagonist:
      protagonist_id: protagonist
      location_id: rented_home.living_room
      location_label: 出租屋客厅
      activity: talking
      body_state: {}
      held_item_ids: []
    scene:
      scene_id: rented_home.living_room
      location_label: 出租屋客厅
      present_character_ids: [protagonist, baiweixi]
      item_states: {}
  previous_heroine_runtime:
    save_id: save-golden
    world_id: world-songjiang
    character_id: baiweixi
    version: 7
    living_mind:
      form: standing
      body: relaxed
      emotion: calm
      attention: protagonist
      current_activity: talking
      immediate_intent: answer the protagonist
    relationship:
      protagonist_id: protagonist
      stage: close_companions
      trust: high
      unresolved_tension: ''
    motive_state: {}
    knowledge_state: {}
    evidence_refs: []
    projection_counts:
      motive_state: 0
      knowledge_state: 0
      evidence_refs: 0
  selected_memory_frame:
    selector_version: memory-selector-v1
    source_memory_ids: []
    source_event_ids: []
    selected_memories: []
  current_protagonist_utterance: 这是占位问题。
  recent_dialogue: []
  pending_actions: []
  game_feedback: []

