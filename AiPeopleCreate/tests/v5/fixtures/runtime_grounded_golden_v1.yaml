    scenario_id: accept.dentist.reschedule
    profile_id: baiweixi
    task_type: reply_accept_authoritative_update
    model_view:
      <<: *model_view_template
      current_protagonist_utterance: 牙医刚通知我，预约改到星期六上午十点了，不是星期五下午。
      recent_dialogue: ["男主：我原来约的是星期五下午。", "白未晞：我记着呢。"]
    oracle_view:
      facts:
        - {fact_id: fact.dentist.sat, subject: protagonist, predicate: dentist_appointment, object: 星期六上午十点, domain: protagonist_plan, source: current_protagonist_utterance, status: current}
        - {fact_id: fact.dentist.fri, subject: protagonist, predicate: dentist_appointment, object: 星期五下午, domain: protagonist_plan, source: recent_dialogue, status: stale}
      correction_direction: accept_authoritative_update
      answer_shape: acknowledge_update_then_restated_fact
      required_assertions:
        - {subject: protagonist, predicate: dentist_appointment, object: 星期六上午十点, source_fact_ids: [fact.dentist.sat]}
      forbidden_assertions:
        - {subject: protagonist, predicate: dentist_appointment, object: 星期五下午, source_fact_ids: [fact.dentist.fri]}
      must_not_be_vague: true
      unsupported_detail_policy: reject
