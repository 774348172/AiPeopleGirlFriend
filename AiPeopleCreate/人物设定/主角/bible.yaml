brief: 《猫咪女友》唯一男主角，成年四川人。大学毕业后来到松江府，从事建筑绘图与设计辅助约两年，因行业不景气失业后经营街角小咖啡厅，独居在老城区出租屋。现实玩家操控他，所有女主角与同一个主角建立独立关系。
