function render(){const all=JSON.parse(localStorage.getItem(key)||'{}');document.getElementById('count').textContent=`已判断 ${Object.keys(all).length} / ${rows.length}`;document.getElementById('list').innerHTML=rows.map((r,i)=>{const s=all[r.sample_id]||{};const disabled=!r.reply_valid;return `<section class="item"><div class="top"><b>第 ${i+1} 条</b><span class="tag">${esc(r.group_cn)}</span><span class="id">${esc(r.sample_id)}</span></div><div class="scene">场景：${esc(r.scene)}</div><div class="history">历史：${esc(r.history.join('\n'))||'无'}</div><div class="turn"><span class="label">男主：</span>${esc(r.user)}</div><div class="reply"><span class="label">白未晞：</span>${esc(r.reply)}</div>${disabled?'<div class="audit" style="color:var(--red)">生成失败：没有合法回复，不可审核为“好”；请标记为“差”。</div>':''}<div class="audit">自动审核：${esc((r.audit.reasons||[]).join('；')||'通过')}</div><div class="actions"><button class="good ${s.verdict==='good'?'selected':''}" ${disabled?'disabled':''} data-verdict="good" data-id="${esc(r.sample_id)}">好</button><button class="bad ${s.verdict==='bad'?'selected':''}" data-verdict="bad" data-id="${esc(r.sample_id)}">差</button></div><textarea class="note" data-note="${esc(r.sample_id)}" placeholder="可选备注">${esc(s.note||'')}</textarea></section>`}).join('')}
document.getElementById('list').addEventListener('click',event=>{const button=event.target.closest('button[data-verdict]');if(!button)return;const note=document.querySelector(`[data-note="${CSS.escape(button.dataset.id)}"]`);setv(button.dataset.id,{verdict:button.dataset.verdict,note:note?note.value:''})});
function save(){const all=JSON.parse(localStorage.getItem(key)||'{}');const invalid=rows.filter(r=>!r.reply_valid&&all[r.sample_id]?.verdict==='good');if(invalid.length){alert('存在生成失败样本被标记为“好”，已拒绝保存。请改为“差”。');return}const blob=new Blob([JSON.stringify(rows.map(r=>({sample_id:r.sample_id,...state(r.sample_id)})),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='baiweixi_v5_natural_fact16_user_review.json';a.click();URL.revokeObjectURL(a.href)}
function clearAll(){localStorage.removeItem(key);render()} render();</script></body></html>
